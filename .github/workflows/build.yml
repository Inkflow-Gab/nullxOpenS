name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o /tmp/nullx .
      - name: Vet
        run: go vet ./...
      - name: Installer checks
        run: |
          python3 -m py_compile setup.py scripts/lane_proxy.py
          bash -n install.sh
      - name: Controller tests
        run: python3 tests/test_controller.py
